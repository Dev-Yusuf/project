services:
  - type: web
    name: igalapedia
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn igalapedia.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MUSIC_STORAGE_BUCKET
        sync: false
