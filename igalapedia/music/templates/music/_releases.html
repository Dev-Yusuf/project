{% if releases %}<div class="music-cards">{% for item in releases %}<a class="music-card" href="{% url 'music:release' item.slug %}" data-music-link><div class="music-card-art">{% if item.artwork %}<img src="{{ item.artwork.url }}" alt="" loading="lazy">{% else %}<span aria-hidden="true">◉</span>{% endif %}</div><h3>{{ item.title }}</h3><p>{{ item.artist.name }} · {{ item.get_kind_display }}</p></a>{% endfor %}</div>{% else %}<div class="music-empty-inline">No releases yet.</div>{% endif %}
