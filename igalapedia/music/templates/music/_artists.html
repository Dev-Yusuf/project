{% if artists %}<div class="music-cards">{% for item in artists %}<a class="music-card artist-card" href="{% url 'music:artist' item.slug %}" data-music-link><div class="music-card-art">{% if item.image %}<img src="{{ item.image.url }}" alt="" loading="lazy">{% else %}<span>{{ item.name|first }}</span>{% endif %}</div><h3>{{ item.name }}</h3><p>Artist</p></a>{% endfor %}</div>{% else %}<div class="music-empty-inline">No artists published yet.</div>{% endif %}
